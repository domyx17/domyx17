<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <!-- Linien oben/unten -->
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>

    <!-- Skill-Balken -->
    <linearGradient id="barFill" x1="0" x2="1">
      <stop offset="0" stop-color="#1f3b73"/>
      <stop offset="0.6" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <pattern id="seg" width="8" height="20" patternUnits="userSpaceOnUse">
      <rect width="6" height="20" fill="#fff"/>
    </pattern>
    <mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="720">
      <rect width="900" height="720" fill="url(#seg)"/>
    </mask>

    <!-- Pixel-Raster für die Berge -->
    <pattern id="px" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
    </pattern>
    <mask id="pxMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="720">
      <rect width="900" height="720" fill="url(#px)"/>
    </mask>

    <!-- Farben der 3 Bergketten -->
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="312">
      <stop offset="0" stop-color="#2f5fb3"/>
      <stop offset="1" stop-color="#14254a"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="312">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#1f3b73"/>
    </linearGradient>
    <linearGradient id="near" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="312">
      <stop offset="0" stop-color="#16305e"/>
      <stop offset="1" stop-color="#0f1f3d"/>
    </linearGradient>
    <linearGradient id="snow" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="160">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>

    <!-- Tanne -->
    <g id="pine">
      <polygon points="0,0 6,10 -6,10"/>
      <polygon points="0,5 8,17 -8,17"/>
      <polygon points="0,10 10,24 -10,24"/>
    </g>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }

      .star  { fill: #cae8ff; font-size: 12px; animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }

      .flake { fill: #cae8ff; font-size: 13px; opacity: 0; animation: fall 10s linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0, 0);        opacity: 0 }
        10%  { opacity: .9 }
        85%  { opacity: .6 }
        100% { transform: translate(-30px, 270px); opacity: 0 }
      }

      .cloud { fill: #79c0ff; opacity: .35; font-size: 12px; white-space: pre;
               animation: drift 60s linear infinite; }
      @keyframes drift { from { transform: translateX(-250px) } to { transform: translateX(1000px) } }

      .wave  { fill: #388bfd; font-size: 12px
